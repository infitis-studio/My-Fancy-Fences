name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Release tags must use vMAJOR.MINOR.PATCH (for example v4.5.0).'
          }
          $notesPath = ".github/release-notes/$env:RELEASE_TAG.md"
          if (-not (Test-Path -LiteralPath $notesPath) -or
              [string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notesPath -Raw))) {
            throw "Missing release-specific changelog: $notesPath"
          }
          [xml]$project = Get-Content 'My Fancy Fences/My Fancy Fences.csproj'
          if ([string]$project.Project.PropertyGroup.Version -ne $env:RELEASE_TAG.Substring(1)) {
            throw 'The project version must match the release tag.'
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish single-file application with .NET 10
        shell: pwsh
        run: |
          $releaseVersion = "${{ github.ref_name }}".TrimStart("v", "V")
          $assemblyVersion = "$releaseVersion.0"
          dotnet publish "My Fancy Fences/My Fancy Fences.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "publish/with-net10" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$releaseVersion `
            -p:AssemblyVersion=$assemblyVersion `
            -p:FileVersion=$assemblyVersion `
            -p:InformationalVersion=$releaseVersion
          Move-Item `
            "publish/with-net10/My Fancy Fences.exe" `
            "My-Fancy-Fences-${{ github.ref_name }}-WITH-NET10-win-x64.exe"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          name: ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            My-Fancy-Fences-${{ github.ref_name }}-WITH-NET10-win-x64.exe
