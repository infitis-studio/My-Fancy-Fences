name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish single-file application with .NET 10
        shell: pwsh
        run: |
          dotnet publish "My Fancy Fences/My Fancy Fences.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "publish/with-net10" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false
          Move-Item `
            "publish/with-net10/My Fancy Fences.exe" `
            "My-Fancy-Fences-${{ github.ref_name }}-WITH-NET10-win-x64.exe"

      - name: Publish single-file application requiring .NET 10
        shell: pwsh
        run: |
          dotnet publish "My Fancy Fences/My Fancy Fences.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output "publish/requires-net10" `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false
          Move-Item `
            "publish/requires-net10/My Fancy Fences.exe" `
            "My-Fancy-Fences-${{ github.ref_name }}-REQUIRES-NET10-win-x64.exe"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            My Fancy Fences 2.1 for Windows x64.

            Highlights:
            - Expanded shared Appearance controls for background, header, and icon styling.
            - Improved management window spacing, dark controls, dropdowns, and sliders.
            - Added layout management improvements for independent panel arrangements.
            - Improved shortcut handling, removal dialogs, and app-managed shortcut storage.
            - Added local download statistics helper source code.

            - WITH NET10: single EXE with .NET 10 included; no additional runtime required.
            - REQUIRES NET10: smaller single EXE; requires .NET 10 Desktop Runtime.
          files: |
            My-Fancy-Fences-${{ github.ref_name }}-WITH-NET10-win-x64.exe
            My-Fancy-Fences-${{ github.ref_name }}-REQUIRES-NET10-win-x64.exe
